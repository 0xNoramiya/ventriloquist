# fly.io: one machine (sessions live in memory), a volume for the database and media.
# Secrets (fly secrets set): MODEL_API_KEY, LIVE_PASSCODE; optionally WHATSAPP_* (docs/API_NOTES.md).
app = "ventriloquist"
primary_region = "sin"

[build]

[env]
  # Live only for a browser that entered LIVE_PASSCODE in Settings; everyone else gets mock mode.
  APP_MODE = "live"

[http_service]
  internal_port = 8080
  force_https = true
  # suspend, not stop: sessions live in memory and must survive an idle spell
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[mounts]
  source = "ventriloquist_data"
  destination = "/data"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
